<!DOCTYPE html>
<html>
<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

 <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />




<style>
body{
    
    margin-bottom: 500px;
    
}

.text-justify{
text-align: justify;
}

.text-danger{
    color:red !important;
}


</style>

</head>
<body class="container mt-5">



<form class="border rounded-2 shadow m-auto p-4 w-50" >

    <div>
        <label class="form-label">Username:</label>
    </div>

    <div>
        <input type="text" placeholder="Username" class="form-control form-control-lg">
    </div>



    <div>
        <label class="form-label">Password:</label>
    </div>

    <div>
        <input type="password" placeholder="Password" class="form-control form-control-lg">
    </div>


     <div>
        <label class="form-label">Email:</label>
    </div>

    <div>
        <input type="email" placeholder="Email" class="form-control form-control-lg">
    </div>

     

    <div>
        <label class="form-label">Choose Gender:</label>
    </div>


    <div class="d-flex gap-3">

        <div class="form-check">
            <input type="radio" name="gender" value="male" class="form-check-input">
            <label class="form-check-label">Male</label>
        </div>


        <div class="form-check">
            <input type="radio" name="gender" value="female" class="form-check-input">
            <label class="form-check-label">Female</label>
        </div>


        <div class="form-check">
            <input type="radio" name="gender" value="other" class="form-check-input">
            <label class="form-check-label">Other</label>
        </div>


      

    </div>



    <div>
        <label class="form-label">Choose Course:</label>
    </div>


    <div class="d-flex gap-3">

        <div class="form-check">
            <input type="checkbox" name="course" value="Java" class="form-check-input">
            <label class="form-check-label">Java</label>
        </div>


        <div class="form-check">
            <input type="checkbox" name="course" value="Python" class="form-check-input">
            <label class="form-check-label">Python</label>
        </div>

        <div class="form-check">
            <input type="checkbox" name="course" value="Ui" class="form-check-input">
            <label class="form-check-label">Ui</label>
        </div>

        <div class="form-check">
            <input type="checkbox" name="course" value=".Net" class="form-check-input">
            <label class="form-check-label">.Net</label>
        </div>




    </div>


    <div>
        <label class="form-label">Select Age:</label>
    </div>

    <div>
        <input type="range" name="age" min="18" age="50" class="form-range">
    </div>



    <div>
        <label class="form-label">Select city:</label>
    </div>

    <div>

        <select class="form-select">
           <option>Select city:</option>
           <option>Hyd</option>
           <option>Pune</option>
           <option>Delhi</option>
        </select>

    </div>


    <div>
        <label class="form-label">Comments:</label>
    </div>

    <div>
        <textarea cols="40" rows="5" class="form-control" placeholder="Enter Commens(Max 100 characters)">
        </textarea>
    </div>



    <div>
        <label class="form-label">Upload Resume:</label>
    </div>

    <div>
        <input type="file" class="form-control">
    </div>



    <div class="mt-2 form-switch">
        <input type="checkbox" class="form-check-input">
        <label class="form-check-label">Accept terms & Conditions</label>
    </div>


    <div class="mt-2">

        <input type="submit" value="Submit" class="btn btn-success">
        <input type="reset" value="clear" class="btn btn-danger">

    </div>
    










</form>




</body>
</html>
