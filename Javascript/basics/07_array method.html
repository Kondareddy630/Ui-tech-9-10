<!DOCTYPE html>
<html>
<head>
    
</head>
<body>

<script>

//array methods

let numbers=[1,101,12,3,5,501,96,4];
console.log(numbers);

//sort();

let asc=numbers.sort(function(a,b){
 return a-b;
})

console.log(asc);


let desc=numbers.sort(function(a,b){
 return b-a;
})

console.log(desc);

// concat()

let even=[2,4,6,8,10];
let odd=[1,3,5,7];

let all=even.concat(odd); // oldway
console.log(all);

//es6 spread operator(...)(FAQ) => used to copy the array or object data quickly


let allnum=[...even,...odd];
console.log(allnum);

let a=[1,2,3,4];
let b=[4,5,6];

let c=[...a,...b];
console.log(c);

let salaries=[5000,6000,9000,7000,9600];

console.log(Math.max(10,20,30));//30

console.log(Math.max(...salaries));
console.log(Math.min(...salaries));

//array destructuring


let colors=["red","blue","cyan","pink"];
console.log(colors);

let x=colors[0];
let y=colors[1];
let z=colors[2];
let p=colors[3];

console.log(x,y,z,p);


let[a1,a2,a3,a4]=colors;//destructuring 
let[a5,a6,a7]=colors;
console.log(a1,a2,a3,a4);
console.log(a5,a6,a7);

// reduce()

let prices=[100,900,800,700];
let sum=0;

let totalPrice=prices.reduce((total,p)=>total+p,0);
console.log(totalPrice);

for(let i=0;i<4;i++)
{
    sum=sum+prices[i];
}

console.log(sum);




</script>
    
</body>
</html>
