<html>
<head>

</head>
<body class="container">


<img src="../../images/baby3.jpg" width="200px" height="200px" id="img1">

<img id="img2">


<img src="../../images/food10.jpg" width="200px" height="200px" id="img3">

<button onclick="replaceImage()">Show new Image</button>

<img src="../../images/food1.jpg" width="200px" height="200px" id="img4">

<br>


<button class="btn btn-success" onclick="prevImage()">Prev</button>
<button class="btn btn-danger" onclick="nextImage()">Next</button>


<br>
<br>


<input type="password" placeholder="EnterPassword" id="t1"> <br>
<input type="checkbox" id="c1" onchange="showPassword()"> <label>Show Password</label>


<script>

function showPassword()
{

    let getType=document.getElementById("t1").getAttribute("type");
    
if(getType==="password")
{
    document.getElementById("t1").setAttribute("type","text");

}

else{
    document.getElementById("t1").setAttribute("type","password");
}

}


let images=["../../images/food1.jpg","../../images/food2.jpg","../../images/food3.jpg",];

let index=0;

function nextImage()
{
    // index=index+1;

    index=(index+1)%images.length;
    document.getElementById("img4").src=images[index];

}

function prevImage()
{
    //index=index-1;
     document.getElementById("img4").src=images[index];

}


    function replaceImage()
    {
        document.getElementById("img3").setAttribute("src","../../images/food9.jpg");

    }

let image=document.getElementById("img1");
console.log(image);

//getAttribute()=>get the attribute value
console.log(image.getAttribute("src"));
console.log(image.getAttribute("width"));
console.log(image.getAttribute("height"));


//setAttribute()=>set the new attribute

let img2=document.getElementById("img2");

img2.setAttribute("src","../../images/baby1.jpg");
img2.setAttribute("width","200px");
img2.setAttribute("height","200px");


</script>
