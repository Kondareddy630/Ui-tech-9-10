<script>
/*

Arrays: js arrays are used to store multiple vlaues
in single variable.
js arrays are allowed same  and diff type values.
you want access the array elements you have to 
use index number. index number always start with 0

*/

let colors; // array decla

colors=[];
colors[0]="red";
colors[1]="blue";
colors[2]="gold";
colors[3]="cyan";

console.log(colors);



let numbers=[10,20,30,40,50,60,70]; // array init
console.log(numbers);

console.log(numbers[0]);
console.log(numbers[1]);
console.log(numbers[2]);
console.log(numbers[3]);
console.log(numbers[-1]);
//at()
console.log(numbers.at(-1));
console.log(numbers.at(-2));
console.log(numbers.at(-3));
console.log(numbers.at(0));
