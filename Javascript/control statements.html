// wap find the number armstrong or not?


let num=123;
let sum=0;
let dup=num;


while(num>0)
{
    let r=num%10;
    sum=sum+r*r*r;
    num=parseInt(num/10);

}

if(dup==sum)
{
    console.log("It is armstrong!!");
}

else{
    console.log("It is not armstrong!!");
