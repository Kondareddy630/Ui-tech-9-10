<!DOCTYPE html>
<html>
<head>
    
</head>
<body>
    

<div>
    <input type="text" placeholder="Number1" id="t1">
</div>

<div>
    <input type="text" placeholder="Number2" id="t2">
</div>

<div>
    <input type="text" placeholder="Result" id="t3">
</div>

<div>
    <button type="button" onclick="t3.value=parseInt(t1.value)+parseInt(t2.value)">Add</button>

    <button type="button" onclick="t3.value=t1.value-t2.value">Sub</button>

    <button type="button" onclick="t3.value=t1.value*t2.value">Mul</button>

    <button type="button" onclick="t3.value=t1.value/t2.value">Div</button>
</div>


</body>
</html>
